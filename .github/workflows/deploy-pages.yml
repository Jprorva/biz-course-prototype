name: Публикация прототипа

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Подключить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Подключить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Собрать сайт
        run: pnpm run build:pages

      - name: Подготовить публикацию
        uses: actions/configure-pages@v5

      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
